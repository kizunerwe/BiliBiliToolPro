name: QingLong Verify

on:
  push:
    paths:
      - "qinglong/**"
      - "scripts/test-qinglong-base.sh"
      - "src/Ray.BiliBiliTool.Console/**"
      - "src/Ray.BiliBiliTool.Application/**"
      - "src/Ray.BiliBiliTool.Application.Contracts/**"
      - "src/Ray.BiliBiliTool.DomainService/**"
      - "src/Ray.BiliBiliTool.Agent/**"
      - "src/Ray.BiliBiliTool.Config/**"
      - "src/Ray.BiliBiliTool.Infrastructure/**"
      - "test/DomainServiceTest/**"
      - "test/InfrastructureTest/**"
      - ".github/workflows/qinglong-verify.yml"
  pull_request:
    paths:
      - "qinglong/**"
      - "scripts/test-qinglong-base.sh"
      - "src/Ray.BiliBiliTool.Console/**"
      - "src/Ray.BiliBiliTool.Application/**"
      - "src/Ray.BiliBiliTool.Application.Contracts/**"
      - "src/Ray.BiliBiliTool.DomainService/**"
      - "src/Ray.BiliBiliTool.Agent/**"
      - "src/Ray.BiliBiliTool.Config/**"
      - "src/Ray.BiliBiliTool.Infrastructure/**"
      - "test/DomainServiceTest/**"
      - "test/InfrastructureTest/**"
      - ".github/workflows/qinglong-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore Console
        run: dotnet restore src/Ray.BiliBiliTool.Console/Ray.BiliBiliTool.Console.csproj
      - name: Build Console
        run: dotnet build src/Ray.BiliBiliTool.Console/Ray.BiliBiliTool.Console.csproj -c Release --no-restore
      - name: Stable domain tests
        id: stable-domain-tests
        continue-on-error: true
        run: dotnet test test/DomainServiceTest/DomainServiceTest.csproj -c Release --filter "Category!=External" --logger "trx;LogFileName=domain-tests.trx" -- xunit.parallelizeTestCollections=false
      - name: Report stable domain test failures
        if: steps.stable-domain-tests.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import glob
          import html
          import xml.etree.ElementTree as ET

          paths = glob.glob('**/domain-tests.trx', recursive=True)
          if not paths:
              print('::error title=Stable domain tests::TRX result file was not produced')
              raise SystemExit(1)

          root = ET.parse(paths[0]).getroot()
          failed = []
          for result in root.findall('.//{*}UnitTestResult'):
              if result.attrib.get('outcome') != 'Failed':
                  continue
              name = result.attrib.get('testName', 'unknown test')
              message = result.findtext('.//{*}Message') or 'no failure message'
              stack = result.findtext('.//{*}StackTrace') or ''
              detail = ' '.join((message + ' ' + stack).split())
              failed.append((name, detail))

          for name, detail in failed:
              print(f'::error title=Stable domain test failed::{html.escape(name)}: {html.escape(detail)}')

          print(f'Found {len(failed)} failed stable domain test(s)')
          raise SystemExit(1)
      - name: Infrastructure tests
        run: dotnet test test/InfrastructureTest/InfrastructureTest.csproj -c Release
      - name: QingLong shell checks
        run: bash scripts/test-qinglong-base.sh
